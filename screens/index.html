<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>GBS India FX Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: GBS 3단 구조 유지 — 상단 TRX 바 / 좌측 업무메뉴 / 중앙 입력폼 + 하단 실행바. 필드 색은 GBS 관례(노랑=필수, 하늘=조회전용) */
:root{
  --bg:#eef2f7; --panel:#ffffff; --panel-2:#f5f8fc; --fg:#1d2733; --muted:#5d6b7c; --line:#c9d4e2;
  --brand:#1559a6; --brand-2:#0f437f; --brand-fg:#ffffff;
  --nav:#2f3d4f; --nav-2:#3c4c61; --nav-fg:#e6edf6; --nav-sub:#9fb4cc;
  --req:#fbf3c2; --ro:#d6e5f5; --input:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e1f3e9; --warn:#9a6400; --warn-bg:#fff1d0; --err:#b3261e; --err-bg:#fde4e2; --info-bg:#e3eefb;
  --mono:"IBM Plex Mono",Consolas,monospace; --sans:"IBM Plex Sans KR","Malgun Gothic",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --panel:#1a222d; --panel-2:#202a37; --fg:#e3e9f1; --muted:#9aa8b9; --line:#33404f;
  --brand:#3d7fcc; --brand-2:#285e9c; --brand-fg:#ffffff;
  --nav:#151c26; --nav-2:#202b39; --nav-fg:#dbe4ef; --nav-sub:#8ea3bb;
  --req:#3a3519; --ro:#1f3147; --input:#121a24;
  --ok:#6fd3a0; --ok-bg:#16352a; --warn:#f2c05c; --warn-bg:#3a2e12; --err:#ff8a80; --err-bg:#3d1a18; --info-bg:#1b2b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --panel:#1a222d; --panel-2:#202a37; --fg:#e3e9f1; --muted:#9aa8b9; --line:#33404f;
  --brand:#3d7fcc; --brand-2:#285e9c; --brand-fg:#ffffff;
  --nav:#151c26; --nav-2:#202b39; --nav-fg:#dbe4ef; --nav-sub:#8ea3bb;
  --req:#3a3519; --ro:#1f3147; --input:#121a24;
  --ok:#6fd3a0; --ok-bg:#16352a; --warn:#f2c05c; --warn-bg:#3a2e12; --err:#ff8a80; --err-bg:#3d1a18; --info-bg:#1b2b40; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(90deg,var(--brand-2),var(--brand));color:var(--brand-fg);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top b{letter-spacing:.06em;font-size:12px}
.top input{font:600 13px var(--mono);width:84px;padding:4px 6px;border:0;border-radius:2px;background:#fff;color:#1d2733;text-transform:uppercase}
.top .ttl{font-weight:600;font-size:15px;border-left:3px solid #f6d34a;padding-left:8px;min-width:0}
.top .sp{flex:1}
.top .biz{font:12px var(--mono);opacity:.9}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 46px)}
nav{background:var(--nav);color:var(--nav-fg);padding:8px 0 24px;overflow:auto}
nav h4{margin:12px 0 4px;padding:6px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-sub);font-weight:600}
nav a{display:flex;gap:8px;padding:7px 16px;color:var(--nav-fg);text-decoration:none;font-size:12.5px;border-left:3px solid transparent}
nav a span{font:600 11.5px var(--mono);color:#8fc1ff;min-width:34px}
nav a:hover{background:var(--nav-2)}
nav a.on{background:var(--nav-2);border-left-color:#f6d34a}
nav a em{font-style:normal;font-size:10px;margin-left:auto;padding:0 5px;border-radius:2px;background:#f6d34a;color:#2a2200;height:16px;align-self:center}
main{padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.mselect{display:none}
.hdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.hdr h1{font-size:19px;margin:0;text-wrap:balance}
.hdr .sid{font:600 12px var(--mono);background:var(--brand);color:var(--brand-fg);padding:2px 7px;border-radius:2px}
.hdr .tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--info-bg);color:var(--fg)}
.hdr p{flex-basis:100%;margin:0;color:var(--muted);max-width:110ch}
.sec{background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.sec>h3{margin:0;padding:6px 10px;font-size:12.5px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sec>h3::before{content:"";width:8px;height:8px;background:#e8792b;border-radius:1px}
.sec>h3 small{font-weight:400;color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:7px 16px;padding:10px}
.f{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;gap:8px;min-width:0}
.f.s2{grid-column:span 2}.f.s3{grid-column:1/-1}
.f label{text-align:right;color:var(--muted);font-size:12px;line-height:1.2}
.f label.rq::after{content:" *";color:var(--err)}
.f .v{display:flex;gap:4px;min-width:0}
input,select,textarea{font:13px var(--sans);color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:2px;padding:4px 6px;min-width:0;width:100%}
input.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
input.rq,select.rq{background:var(--req)}
input[readonly],select[disabled]{background:var(--ro);color:var(--fg)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #f6a623;outline-offset:1px}
.bad{border-color:var(--err)!important;box-shadow:0 0 0 1px var(--err)}
button{font:500 12.5px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:5px 12px;border-radius:2px;cursor:pointer;white-space:nowrap}
button.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
button.ic{padding:4px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs button{border-bottom:0;border-radius:3px 3px 0 0;background:var(--panel-2);font-weight:600}
.tabs button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.tw{overflow-x:auto;padding:8px 10px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{background:var(--brand-2);color:var(--brand-fg);font-weight:600;padding:5px 7px;text-align:left;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:4px 7px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.sel td{background:var(--info-bg)}
.pill{display:inline-block;font:600 10.5px var(--sans);padding:1px 7px;border-radius:9px}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-err{background:var(--err-bg);color:var(--err)}.p-info{background:var(--info-bg);color:var(--fg)}
.msg{margin:8px 10px;padding:7px 10px;border-left:4px solid;font-size:12.5px}
.msg.ok{background:var(--ok-bg);border-color:var(--ok)}.msg.warn{background:var(--warn-bg);border-color:var(--warn)}.msg.err{background:var(--err-bg);border-color:var(--err)}.msg.info{background:var(--info-bg);border-color:var(--brand)}
.msg code,.rule{font:11px var(--mono);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:10px}
.kpi{border:1px solid var(--line);padding:8px 10px;background:var(--panel-2)}
.kpi b{display:block;font:600 20px var(--mono)}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.gauge{height:12px;background:var(--panel-2);border:1px solid var(--line);margin:4px 0;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--brand)}
.gauge i.cur{background:#f6a623}
.tl{display:flex;flex-wrap:wrap;gap:0;padding:12px 10px}
.tl div{flex:1 1 140px;border-top:4px solid var(--line);padding:6px 8px 0;position:relative}
.tl div::before{content:"";position:absolute;top:-8px;left:6px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:3px solid var(--line)}
.tl div.done{border-color:var(--ok)}.tl div.done::before{border-color:var(--ok);background:var(--ok)}
.tl div.due{border-color:var(--warn)}.tl div.due::before{border-color:var(--warn)}
.tl div.over{border-color:var(--err)}.tl div.over::before{border-color:var(--err)}
.tl b{display:block;font:600 12.5px var(--mono)}.tl span{font-size:11.5px;color:var(--muted)}
pre.mt{font:12px/1.5 var(--mono);background:var(--panel-2);border:1px solid var(--line);padding:10px;margin:0;overflow-x:auto;white-space:pre}
.mtw{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;padding:10px}
.mtw h5{margin:0 0 4px;font-size:11.5px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;
  padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:4}
.bar .log{margin-right:auto;font-size:12px;color:var(--muted);min-width:0;flex:1 1 260px}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);max-width:460px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal .box h4{margin:0;padding:10px 14px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.modal .box p{padding:12px 14px;margin:0}
.modal .box div{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;padding:10px}
.cat label{border:1px solid var(--line);padding:8px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;background:var(--panel-2)}
.cat label:has(input:checked){border-color:var(--brand);background:var(--info-bg)}
.cat input{width:auto;margin-top:3px}
a.flink{color:var(--brand);font-weight:600}
.cat small{display:block;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.steps button{flex:1 1 130px;display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left;border:1px solid var(--line);border-bottom:3px solid var(--line);background:var(--panel);padding:6px 10px}
.steps button b{font:600 11px var(--mono);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line)}
.steps button.ok{border-bottom-color:var(--ok)}.steps button.ok b{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps button.warn{border-bottom-color:var(--warn)}.steps button.warn b{background:var(--warn);color:#fff;border-color:var(--warn)}
.steps button.err{border-bottom-color:var(--err)}.steps button.err b{background:var(--err);color:#fff;border-color:var(--err)}
.stp{scroll-margin-top:64px}
.rm{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;padding:0 10px 10px}
.rm label{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:var(--panel-2);position:relative}
.rm label input{position:absolute;top:9px;right:9px;width:auto}
.rm label b{font-size:13px;padding-right:20px}
.rm label small{color:var(--muted);font-size:11.5px;line-height:1.3}
.rm label small.why{color:var(--fg)}
.rm label:has(input:checked){border:2px solid var(--brand);background:var(--info-bg);padding:7px 9px}
.rm label.off{opacity:.55;cursor:not-allowed}
.lane{display:grid;grid-template-columns:108px minmax(0,1fr);gap:8px;align-items:center;padding:6px 10px;border-bottom:1px dashed var(--line)}
.lane>span{font-size:11.5px;color:var(--muted);font-weight:600}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-width:0}
.chain .nd{border:1px solid var(--line);background:var(--panel);padding:5px 8px;font-size:11.5px;text-align:center;min-width:96px;max-width:190px}
.chain .nd b{display:block;font-size:12px}
.chain .ar{font:10.5px var(--mono);color:var(--brand);text-align:center;padding:0 2px;display:flex;flex-direction:column;align-items:center}
.chain .ar i{font-style:normal;color:var(--muted);letter-spacing:-1px}
@media (max-width:900px){.lane{grid-template-columns:1fr}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav{display:none}
  .mselect{display:block;margin-bottom:10px}
  .grid{--c:1!important}
  .f.s2,.f.s3{grid-column:auto}
  .f{grid-template-columns:110px minmax(0,1fr)}
}
@media (max-width:420px){.f{grid-template-columns:1fr}.f label{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <b>TRX CODE</b><input id="trx" value="RT13" aria-label="화면코드 입력 후 Enter">
  <div class="ttl" id="ttl">Remittance (Trade Finance)</div>
  <div class="sp"></div>
  <div class="biz">India Noida · AD Cat-I · TRX DATE <span id="bizd"></span></div>
</header>
<div class="wrap">
  <nav id="nav" aria-label="업무 메뉴"></nav>
  <main>
    <select class="mselect" id="msel" aria-label="화면 선택"></select>
    <div id="view"></div>
  </main>
</div>
<div class="bar">
  <div class="log" id="log">화면을 선택하세요. 노란 칸은 필수, 하늘색은 CH11 등에서 조회되는 값입니다(예시 데이터).</div>
  <button id="bClr">Clear</button><button id="bChk">Validate</button><button class="pri" id="bExe">Execute</button>
</div>
<div class="modal" id="modal" hidden><div class="box"><h4 id="mT">Warning</h4><p id="mB"></p><div><button id="mN">N (중단)</button><button class="pri" id="mY">Y (계속)</button></div></div></div>

<script>
"use strict";
const BIZ = "2026-10-31";               // 영업일(예시) - 기한계산 기준
const P = {                             // TB_FX_PARAM (요약)
  LRS_LIMIT_USD:250000, TCS_TH:1000000, TCS_GEN:20, TCS_EDU:5, TCS_LOAN:0, LEI_INR:500000000,
  IMP_ADV_M:6, IMP_ADV_CAP_M:36, IMP_GRACE:15, BG_USD:200000, BOE_REG:180, PROFORMA_DAYS:180,
  EXP_REAL_M:9, EXP_DOC:21, FDI_ALLOT:60, FDI_REFUND:15, FCGPR:30, FLAT_COMM:750, GST:18
};
const RATE = {USD:88.42, EUR:102.35, JPY:0.5841, GBP:117.9, AED:24.07, KRW:0.0634};
const CUST = {                          // CH11 예시 고객 (가상 데이터)
  "00000038":{name:"HANBIT AGRO INDIA PVT LTD", type:"CORP", pan:"AAACH4821K", iec:"AAACH4821K", lei:"5493001KJTIIGC8Y1R12", leiExp:"2026-08-14", gstin:"09AAACH4821K1Z5", acct:[["6015907000250","CA","INR",18452300.55],["6015907100013","EEFC","USD",215400.00]]},
  "00000052":{name:"SEOUL PRECISION PARTS INDIA LTD", type:"CORP", pan:"AABCS7710Q", iec:"AABCS7710Q", lei:"984500A1B2C3D4E5F627", leiExp:"2027-03-02", gstin:"06AABCS7710Q1ZT", acct:[["6015907000412","CA","INR",612004110.00]]},
  "00000107":{name:"PRIYA MEHTA", type:"IND", pan:"BQRPM5521L", iec:"", lei:"", leiExp:"", gstin:"", acct:[["6015907200871","SA","INR",3804210.00]], fyUsd:182500, fyInr:16050000, otherBank:12000}
};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = (n,d=2) => (isFinite(n)?Number(n):0).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const num = id => parseFloat(String(($("#"+id)||{}).value||"0").replace(/,/g,""))||0;
const val = id => ($("#"+id)||{}).value||"";
const D = s => new Date(s+"T00:00:00Z");
const iso = d => d.toISOString().slice(0,10);
const addD = (s,n) => { const d=D(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const addM = (s,n) => { const d=D(s), day=d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n);
  const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate(); d.setUTCDate(Math.min(day,last)); return iso(d); };
const diff = (a,b) => Math.round((D(b)-D(a))/864e5);
const fy = s => { const d=D(s), y=d.getUTCMonth()>=3?d.getUTCFullYear():d.getUTCFullYear()-1; return `${y}-${String(y+1).slice(2)}`; };
const pill = (t,k) => `<span class="pill p-${k}">${t}</span>`;
const log = (t) => { $("#log").innerHTML = t; };
const leiValid = l => { if(!/^[A-Z0-9]{18}[0-9]{2}$/.test(l)) return false;
  let r=0; for(const c of l){ const v=parseInt(c,36).toString(); for(const ch of v) r=(r*10+ +ch)%97; } return r===1; };

/* ---------- GST 엔진 (R-GST-01~06) ---------- */
const BR_STATE="09";                      // 지점 주코드 (Uttar Pradesh)
const r2 = x => Math.round((x+Number.EPSILON)*100)/100;
function gstFxValue(inr){ if(inr<=0) return 0; if(inr<=1e5) return r2(Math.max(250,inr*0.01)); if(inr<=1e6) return r2(1000+(inr-1e5)*0.005); return r2(Math.min(60000,5500+(inr-1e6)*0.001)); }
// charges: [[GL, 설명, 금액]] 과세 수수료 / convInr: 환전 INR(무환전 0) / rcpt: R_ACCT·NR_ACCT·NR_NONACCT·R_NONACCT / state: 고객 주코드
function gstCalc(charges, convInr, rcpt, state){
  const cv=gstFxValue(convInr), base=r2(charges.reduce((a,c)=>a+c[2],0)+cv), gst=r2(base*.18), rows=charges.slice();
  if(cv) rows.push(["-",`환전 과세표준 32(2)(b): INR ${fmt(convInr)} → ${fmt(cv)} (과세표준만, 미징수)`,null]);
  let pos, why;
  if(rcpt==="NR_NONACCT"){ rows.push(["-","GST 영세율 (수출용역 · LUT)",0]); pos="96 (국외)"; why="해외 비계좌 수령자 → s.13(2) 국외 공급"; }
  else { const intra = rcpt==="R_ACCT" ? (state||BR_STATE)===BR_STATE : true;
    why = rcpt==="R_ACCT" ? "거주자 계좌고객 → 은행 기록상 고객 주 (s.12(12))" : rcpt==="NR_ACCT" ? "비거주 계좌고객 → 공급자 소재지 (s.13(8)(a))" : "비계좌 거주자 → 공급자 소재지 (s.12(12))";
    // 세액은 과세표준 합계로 계산하고 GL은 L6(수수료분 x01 / 환전분 x02)로 배분 (06 CoA 결정 T7)
    const split=(h,rate,amt,gl)=>{ const fx=base?r2(amt*cv/base):0, fee=r2(amt-fx);
      if(fee) rows.push([gl+"01",`${h} ${rate} on ${fmt(base)}${fx?" · 수수료분":""}`,fee]); if(fx) rows.push([gl+"02",`${h} ${rate} on ${fmt(base)} · 환전분`,fx]); };

  if(inr>=P.LEI_INR){ if(!c.lei||exp) m.push(["err",`INR ${fmt(inr,0)} ≥ 50 crore: 유효한 LEI 필수 <span class='rule'>R-CM-03</span>`]); }
  else if(exp) m.push(["lei",""]);
  return m; }
function show(m){
  if(m.some(x=>x[0]==="lei")){ m=m.filter(x=>x[0]!=="lei");
    $("#mB").textContent="Warning : LEI No. Expired but Less than INR 50 Crore. Proceed Y / N?"; $("#modal").hidden=false; $("#mY").focus();
    $("#mY").onclick=()=>{ $("#modal").hidden=true; log(`<span class="pill p-warn">WARN</span> LEI 만료 경고 승인(LEI_WARN_ACK_YN=Y). `+m.map(x=>x[1]).join(" · ")); };
    $("#mN").onclick=()=>{ $("#modal").hidden=true; log(`<span class="pill p-err">STOP</span> 사용자가 LEI 만료 경고에서 중단했습니다.`); };
    return; }
  const k=m.some(x=>x[0]==="err")?"err":m.some(x=>x[0]==="warn")?"warn":"ok";
  log(`<span class="pill p-${k}">${k.toUpperCase()}</span> `+m.map(x=>x[1]).join(" · "));
}

  $("#nav").innerHTML=h; $("#msel").innerHTML=order.map(k=>`<option value="${k}">${S[k].id} · ${S[k].t}</option>`).join(""); }

  const SIMK={rt11:"OUT_GEN",rt12:"OUT_LRS",rt13:"OUT_TRD",rt14:"OUT_NR",rt21:"IN_GEN",fd11:"IN_FDI",fx11:"FX_ACCT"}[k];

  $("#ttl").textContent=s.t; $("#trx").value=s.id; $("#msel").value=k;
  $$("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===k));
  s.init&&s.init.call(s); log(`${s.id} 화면 로드 · 예시 데이터 (가상 고객)`);
  try{ localStorage.setItem("gbs.last",k); }catch(e){}
}

$("#bizd").textContent=BIZ.replace(/-/g,"/");

$("#msel").addEventListener("change",e=>{ location.hash=e.target.value; });

$("#bExe").addEventListener("click",()=>{ const s=S[cur]; if(cur==="pm01") s.exec=true; if(s.chk) s.chk.call(s); if(!$("#log .p-err") && $("#modal").hidden) log($("#log").innerHTML+` · <b>Maker 등록 완료 → Checker 승인 대기</b>`); });

document.addEventListener("click",e=>{ const sp=e.target.closest("[data-step]"); if(sp){ const t=document.getElementById(sp.dataset.step); if(t) t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); return; }
  const sm=e.target.closest("[data-sim]"); if(sm){ try{ sessionStorage.setItem("simPreset",sm.dataset.sim); }catch(x){} }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const t={cust:"CH11 고객조회 팝업",ref:"송금 Ref 조회",boe:"IDPMS BoE 조회: 4718263 / 2026-09-18 / INNSA1 / USD 48,500.00 / Product 01",idpms:"IDPMS 수신 BoE 목록 조회",rt73:"RT73 Invoice 조회 팝업",xp11:"XP11 DA/DP 조회",fdi:"FDI 조회",bic:"BIC 디렉터리 조회 (TB_BIC_DIR · SWIFTRef) - 예시 수취은행 목록에서 선택하세요",fu:"독촉 이력 기록 (FOLLOWUP_CNT+1)",fix:"ORM 정정(M) 큐 등록"}[a.dataset.act];
  if(a.dataset.act==="boe"){ $("#boe").value="4718263"; $("#boed").value="2026-09-18"; $("#boev").value="USD 48,500.00 · BoE Product 01"; S.rt13.calc(); }
  log(`<span class="pill p-info">INFO</span> ${t}`); });
let start=location.hash.slice(1); if(!S[start]){ try{ start=localStorage.getItem("gbs.last")||"rt13"; }catch(e){ start="rt13"; } }
go(start);
